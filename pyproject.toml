[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grail"
version = "0.1.0"
description = "GRAIL: Gaze-based neuRosymbolic imitAtion Learner — shared library for the gaze + NSFR pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["grail*"]
